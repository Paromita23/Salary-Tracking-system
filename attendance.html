<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTracker Pro + Analytics</title>
    <!-- Adding Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --present: #28a745; --absent: #dc3545; --wfh: #007bff;
            --sunday: #ffc107; --holiday: #6f42c1;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin-top: 0; color: #1a73e8; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:active { background: #1557b0; transform: scale(0.98); }
        
        .stat-box { text-align: center; padding: 10px; border-radius: 8px; background: #f8f9fa; border: 1px solid #eee; }
        .stat-val { font-size: 1.1rem; font-weight: bold; display: block; color: #1a73e8; }
        .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th { background: #f8f9fa; padding: 10px; border-bottom: 2px solid #ddd; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }

        .row-Present { border-left: 5px solid var(--present); }
        .row-Absent { border-left: 5px solid var(--absent); background: #fff5f5; }
        .row-WFH { border-left: 5px solid var(--wfh); }
        .row-Sunday { border-left: 5px solid var(--sunday); }
        .row-Holiday { border-left: 5px solid var(--holiday); }

        .insight-content { display: flex; flex-direction: column; gap: 15px; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .text-insights { font-size: 0.85rem; line-height: 1.6; background: #f0f7ff; padding: 10px; border-radius: 8px; border-left: 4px solid #1a73e8; }
        
        .del-btn { background: #ffebee; color: #c62828; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Month & Earnings</h3>
        <select id="monthYearPicker" onchange="renderData()"></select>
        
        <div class="grid">
            <div class="stat-box">
                <span class="stat-label">Net Salary</span>
                <span class="stat-val" id="netSalary">₹0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">PTax (₹110)</span>
                <span class="stat-val" id="ptaxDisplay" style="color: #dc3545;">₹0</span>
            </div>
        </div>
        <div style="margin-top:10px;">
            <label>Credit Date:</label>
            <input type="date" id="receivedDate" onchange="saveReceivedDate()">
        </div>
    </div>

    <div class="card">
        <h3>Mark Attendance</h3>
        <div class="grid">
            <div>
                <label>Date</label>
                <input type="date" id="entryDate">
            </div>
            <div>
                <label>Status</label>
                <select id="entryStatus">
                    <option value="Present">Present</option>
                    <option value="WFH">WFH</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Holiday">Holiday</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>
        </div>
        <button onclick="addEntry()">Add to Tracker</button>
    </div>

    <!-- NEW INSIGHTS CARD WITH CHART -->
    <div class="card">
        <h3>Key Insights & Analytics</h3>
        <div class="insight-content">
            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
            <div id="insightsText" class="text-insights">
                No data yet.
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Log Details</h3>
        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const BASE_SALARY = 12000;
        const PTAX_THRESHOLD = 10000;
        const PTAX_AMOUNT = 110;
        let myChart = null;

        function initDropdown() {
            const select = document.getElementById('monthYearPicker');
            const start = new Date(2026, 2); 
            const end = new Date();
            end.setMonth(end.getMonth() + 2); 

            let curr = new Date(start);
            while (curr <= end) {
                let monthLabel = curr.toLocaleString('default', { month: 'long', year: 'numeric' });
                let monthVal = `${curr.getFullYear()}-${curr.getMonth()}`;
                let opt = new Option(monthLabel, monthVal);
                select.add(opt);
                curr.setMonth(curr.getMonth() + 1);
            }
            select.value = `${new Date().getFullYear()}-${new Date().getMonth()}`;
        }

        function getStorageKey() {
            return 'data_' + document.getElementById('monthYearPicker').value;
        }

        function addEntry() {
            const date = document.getElementById('entryDate').value;
            const status = document.getElementById('entryStatus').value;
            if (!date) return alert("Select Date");

            let data = JSON.parse(localStorage.getItem(getStorageKey())) || { entries: {}, receivedDate: '' };
            data.entries[date] = status;
            localStorage.setItem(getStorageKey(), JSON.stringify(data));
            renderData();
        }

        function deleteEntry(date) {
            if(confirm("Delete this entry?")) {
                let data = JSON.parse(localStorage.getItem(getStorageKey()));
                delete data.entries[date];
                localStorage.setItem(getStorageKey(), JSON.stringify(data));
                renderData();
            }
        }

        function saveReceivedDate() {
            let data = JSON.parse(localStorage.getItem(getStorageKey())) || { entries: {}, receivedDate: '' };
            data.receivedDate = document.getElementById('receivedDate').value;
            localStorage.setItem(getStorageKey(), JSON.stringify(data));
            renderData();
        }

        function updateChart(counts) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            
            if (myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Present', 'WFH', 'Sunday', 'Holiday', 'Absent'],
                    datasets: [{
                        data: [counts.Present, counts.WFH, counts.Sunday, counts.Holiday, counts.Absent],
                        backgroundColor: ['#28a745', '#007bff', '#ffc107', '#6f42c1', '#dc3545'],
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } }
                    }
                }
            });
        }

        function renderData() {
            const storage = JSON.parse(localStorage.getItem(getStorageKey())) || { entries: {}, receivedDate: '' };
            const entries = storage.entries;
            document.getElementById('receivedDate').value = storage.receivedDate || '';

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const [year, month] = document.getElementById('monthYearPicker').value.split('-').map(Number);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dailyRate = BASE_SALARY / daysInMonth;

            let counts = { Present: 0, Absent: 0, WFH: 0, Sunday: 0, Holiday: 0 };
            const sortedDates = Object.keys(entries).sort();

            sortedDates.forEach(date => {
                const status = entries[date];
                counts[status]++;
                
                const row = document.createElement('tr');
                row.className = `row-${status}`;
                const displayDate = new Date(date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
                row.innerHTML = `
                    <td>${displayDate}</td>
                    <td style="font-weight:bold; color:var(--${status.toLowerCase()})">${status}</td>
                    <td style="text-align:right"><button class="del-btn" onclick="deleteEntry('${date}')">Delete</button></td>
                `;
                tbody.appendChild(row);
            });

            let paidDays = counts.Present + counts.WFH + counts.Sunday + counts.Holiday;
            let grossSalary = paidDays * dailyRate;
            let ptax = grossSalary > PTAX_THRESHOLD ? PTAX_AMOUNT : 0;
            let netSalary = Math.max(0, grossSalary - ptax);

            document.getElementById('netSalary').innerText = `₹${Math.round(netSalary)}`;
            document.getElementById('ptaxDisplay').innerText = `₹${ptax}`;

            // Update Insights Text
            const lop = Math.round(counts.Absent * dailyRate);
            document.getElementById('insightsText').innerHTML = `
                <b>Month Performance:</b><br>
                • You were paid for <b>${paidDays}</b> out of ${daysInMonth} days.<br>
                • Loss of Pay (LOP): <span style="color:red">₹${lop}</span><br>
                • ${ptax > 0 ? 'Professional Tax (₹110) was applied.' : 'No PTax deduction this month.'}
            `;

            updateChart(counts);
        }

        initDropdown();
        document.getElementById('entryDate').valueAsDate = new Date();
        renderData();
    </script>
</body>
</html>
